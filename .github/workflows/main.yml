name: Build Android

on:
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.2

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install Haxelib Dependencies
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Configure Android SDK/NDK
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Verify Android Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ANDROID SDK NOT FOUND!"
            exit 1
          fi

          if [ ! -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "ANDROID NDK NOT FOUND!"
            exit 1
          fi

      - name: Accept Google Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Google Services
        run: |
          if [ -f "google-services.json" ]; then
            echo "google-services.json found"
          else
            echo "google-services.json not found"
          fi

      - name: Generate Android Keystore
        run: |
          keytool -genkeypair -v \
            -keystore key.keystore \
            -storetype JKS \
            -alias psychengine \
            -storepass psychengine \
            -keypass psychengine \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PsychEngine,O=Dev,C=BR"

      - name: Build APK
        run: |
          haxelib run lime build android -release

      - name: Verify APK
        run: |
          APK=$(find export -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT GENERATED!"
            exit 1
          fi

          echo "APK GENERATED:"
          echo "$APK"

          jarsigner -verify "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error